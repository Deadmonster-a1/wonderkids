name = "wonderkids-server"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
CORS_ORIGIN = "http://localhost:5173"
ADMIN_EMAIL = "masteraccess72@gmail.com"
# ADMIN_PASSWORD and JWT_SECRET should be set via `wrangler secret put`

[[r2_buckets]]
binding = "UPLOAD_BUCKET"
bucket_name = "wonderkids-uploads"

# If using Prisma Accelerate, set DATABASE_URL via secret
# If using Hyperdrive for direct DB connection:
# [[hyperdrive]]
# binding = "DB"
# id = "<hyperdrive-id>"
